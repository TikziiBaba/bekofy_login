<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bekofy - Giriş Yap</title>
  <link rel="stylesheet" href="css/style.css?v=max5">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.7/dist/umd/supabase.js" integrity="sha256-Jpf1G7PvpfELWwvKKjmzdysbj4EOaIXju41pwyQtXgc=" crossorigin="anonymous"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <style>
    .auth-cyber-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 120px 20px 60px;
      position: relative;
      z-index: 10;
    }
  </style>
</head>

<body>
  <!-- Cyber Background Layer -->
  <div class="cyber-bg"></div>
  <div class="ambient-glow ambient-glow-1"></div>

  <!-- Glass Navigation -->
  <nav class="site-nav">
    <a href="index.html" class="nav-brand">
      <div class="brand-logo-icon">B</div>
      <span class="brand-text">BEKOFY</span>
    </a>
    <div class="nav-links">
      <a href="index.html" class="nav-item-link">Ana Sayfa</a>
      <a href="premium.html" class="nav-item-link">Premium</a>
      <a href="https://github.com/TikziiBaba/bekofy_login/releases" target="_blank" class="nav-item-link">İndir</a>
    </div>
  </nav>

  <main class="auth-cyber-wrapper">
    <div style="width: 100%; max-width: 420px;">
      <div id="success-msg" class="success-msg"></div>
      <div id="error-msg" class="error-msg"></div>

      <form class="form" id="login-form">
        <p>
          Giriş Yap<span>Hesabına giriş yap ve müziğe başla</span>
        </p>
        <button type="button" class="oauthButton" id="btn-google-login">
          <svg class="icon" viewBox="0 0 24 24" width="20" height="20" style="width:20px;height:20px;flex-shrink:0;">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
          </svg>
          Google ile devam et
        </button>
        <div class="separator">
          <div></div>
          <span>VEYA</span>
          <div></div>
        </div>
        <input type="email" placeholder="E-posta" name="email" id="login-email">
        <input type="password" placeholder="Şifre" name="password" id="login-password">
        <button type="button" class="oauthButton" id="btn-login" style="background: var(--neon); color: #000; font-weight: 800;">
          <span>Giriş Yap ➔</span>
        </button>
        <p class="auth-switch" style="font-size: 14px; color: var(--text-muted); margin-top: 10px;">
          Hesabın yok mu? <a href="register.html" style="color: var(--neon); font-weight: 700; text-decoration: none;">Kayıt Ol</a>
        </p>
      </form>
    </div>
  </main>

  <footer class="cyber-footer">
    <p>© 2026 Bekofy. Tüm hakları saklıdır.</p>
  </footer>
</body>

</html>
