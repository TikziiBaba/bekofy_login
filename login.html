<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bekofy - Giriş Yap</title>
  <meta name="description" content="Bekofy hesabınıza giriş yapın. Milyonlarca ücretsiz şarkı, canlı şarkı sözleri ve Mini Player sizi bekliyor.">
  
  <link rel="stylesheet" href="css/style.css?v=unified2.0">
  <link rel="stylesheet" href="css/auth.css?v=unified2.0">
  <link rel="stylesheet" href="css/mobile.css?v=unified2.0">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.7/dist/umd/supabase.js" integrity="sha256-Jpf1G7PvpfELWwvKKjmzdysbj4EOaIXju41pwyQtXgc=" crossorigin="anonymous"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
</head>

<body class="auth-body-page">
  <!-- Top GSAP Scroll Progress Bar -->
  <div id="gsap-scroll-bar"></div>

  <!-- Header Navigation -->
  <header class="site-header">
    <div class="header-container">
      <a href="index.html" class="logo-brand">
        <div class="logo-badge">B</div>
        <span class="logo-name">Bekofy</span>
      </a>
      <nav class="nav-links">
        <a href="index.html" class="nav-link">Keşfet</a>
        <a href="premium.html" class="nav-link">Premium</a>
        <a href="dashboard.html" class="nav-link">Hesabım</a>
      </nav>
      <div class="nav-actions">
        <a href="login.html" class="btn-minimal btn-secondary active">Giriş Yap</a>
        <a href="register.html" class="btn-minimal btn-primary">Kayıt Ol</a>
      </div>
    </div>
  </header>

  <!-- Ambient Background Mesh Blobs & Floating Notes -->
  <div class="ambient-mesh-bg">
    <div class="ambient-blob blob-1"></div>
    <div class="ambient-blob blob-2"></div>
    <div class="ambient-blob blob-3"></div>
    <div class="floating-notes">
      <span class="note">♪</span>
      <span class="note">♫</span>
      <span class="note">♩</span>
      <span class="note">♬</span>
    </div>
  </div>

  <!-- Auth Content Stage -->
  <main class="auth-page-wrapper scroll-reveal is-visible">
    <div class="auth-card">
      <div class="auth-card-header">
        <h1 class="auth-card-title">HOŞ GELDİNİZ 👋</h1>
        <p class="auth-card-sub">Müziğe devam etmek için hesabınıza giriş yapın</p>
      </div>

      <div id="success-msg" class="success-msg"></div>
      <div id="error-msg" class="error-msg"></div>

      <form id="login-form">
        <button type="button" class="btn-oauth-google" id="btn-google-login">
          <svg viewBox="0 0 24 24" width="20" height="20" style="width:20px;height:20px;flex-shrink:0;">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
          </svg>
          Google ile Devam Et
        </button>

        <div class="auth-divider">VEYA</div>

        <div class="auth-field">
          <input type="email" class="auth-input" placeholder="E-posta Adresi" name="email" id="login-email" required autocomplete="email">
        </div>

        <div class="auth-field">
          <input type="password" class="auth-input" placeholder="Şifre" name="password" id="login-password" required autocomplete="current-password">
        </div>

        <button type="button" class="btn-auth-submit" id="btn-login">
          Giriş Yap ➔
        </button>

        <p class="auth-footer-text">
          Hesabınız yok mu? <a href="register.html">Hemen Kayıt Ol</a>
        </p>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <p>© 2026 Bekofy. Tüm hakları saklıdır.</p>
  </footer>
</body>

</html>
