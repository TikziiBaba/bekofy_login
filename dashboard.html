<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bekofy - Kumanda Merkezi</title>
  <meta name="description" content="Bekofy kullanıcı hesabı ve profil yönetim paneli.">
  
  <link rel="stylesheet" href="css/style.css?v=unified2.0">
  <link rel="stylesheet" href="css/profile.css?v=unified2.0">
  <link rel="stylesheet" href="css/mobile.css?v=unified2.0">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.7/dist/umd/supabase.js" integrity="sha256-Jpf1G7PvpfELWwvKKjmzdysbj4EOaIXju41pwyQtXgc=" crossorigin="anonymous"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
</head>

<body>
  <!-- Header Navigation -->
  <header class="site-header">
    <div class="header-container">
      <a href="index.html" class="logo-brand">
        <div class="logo-badge">B</div>
        <span class="logo-name">Bekofy</span>
      </a>
      <nav class="nav-links">
        <a href="index.html" class="nav-link">Keşfet</a>
        <a href="premium.html" class="nav-link">Premium</a>
        <a href="dashboard.html" class="nav-link active">Hesabım</a>
        <a href="artist.html" id="nav-artist-link" class="nav-link" style="display:none; color: var(--emerald);">Sanatçı Kulisi</a>
      </nav>
      <div class="nav-actions">
        <button id="btn-logout" class="btn-minimal btn-secondary">Çıkış Yap</button>
      </div>
    </div>
  </header>

  <!-- Ambient Background Mesh Blobs -->
  <div class="ambient-mesh-bg">
    <div class="ambient-blob blob-1"></div>
    <div class="ambient-blob blob-2"></div>
  </div>

  <!-- Dashboard Main Stage -->
  <main class="dash-page-wrapper scroll-reveal is-visible">
    <div class="section-head" style="text-align: left; margin-bottom: 32px;">
      <span class="section-label">HESAP YÖNETİMİ</span>
      <h1 class="section-title">KUMANDA MERKEZİ 🎛️</h1>
    </div>

    <div class="dash-bento-grid">
      <!-- Profile Card -->
      <div class="dash-profile-card">
        <div class="dash-avatar-box" id="dash-avatar" title="Avatar Değiştir">
          <span id="dash-avatar-initials">?</span>
        </div>
        <div>
          <h2 style="font-family: var(--font-display); font-size: 32px; font-weight: 800; margin-bottom: 4px;" id="dash-username">Yükleniyor...</h2>
          <div style="font-family: var(--font-code); color: var(--text-gray); font-size: 14px; margin-bottom: 12px;" id="dash-email">Sorgulanıyor...</div>
          <span style="display: inline-block; padding: 4px 14px; background: rgba(30, 215, 96, 0.15); color: var(--emerald); border: 1px solid var(--emerald); border-radius: var(--radius-pill); font-size: 12px; font-weight: 700;" id="dash-role-badge">Kullanıcı</span>
        </div>
      </div>

      <!-- Subscription Card -->
      <div class="dash-panel-card col-span-4">
        <div>
          <h3 style="font-family: var(--font-display); font-size: 20px; font-weight: 800; margin-bottom: 16px;">PAKET STATÜSÜ</h3>
          <div style="margin-bottom: 12px;">
            <label style="font-size: 11px; color: var(--text-muted); font-weight: 700; text-transform: uppercase;">Mevcut Plan</label>
            <div id="dash-plan" style="font-family: var(--font-code); font-size: 16px; color: var(--emerald); font-weight: 700; margin-top: 4px;">
              ÜCRETSİZ PLAN
            </div>
          </div>
        </div>
        <a href="premium.html" class="btn-minimal btn-primary" style="text-decoration:none; text-align:center; width:100%; margin-top:16px;">
          Premium'a Yükselt ⚡
        </a>
      </div>

      <!-- Identity Card -->
      <div class="dash-panel-card col-span-4">
        <div>
          <h3 style="font-family: var(--font-display); font-size: 20px; font-weight: 800; margin-bottom: 16px;">KULLANICI ADI</h3>
          <div class="auth-field">
            <input type="text" id="edit-username" class="auth-input" placeholder="Yeni kullanıcı adı...">
          </div>
        </div>
        <button class="btn-minimal btn-secondary" id="btn-save-username" style="width:100%; margin-top:16px;">
          Kaydet
        </button>
      </div>

      <!-- Security Card -->
      <div class="dash-panel-card col-span-4">
        <div>
          <h3 style="font-family: var(--font-display); font-size: 20px; font-weight: 800; margin-bottom: 16px;">ŞİFRE DEĞİŞTİR</h3>
          <div class="auth-field">
            <input type="password" id="edit-password" class="auth-input" placeholder="Yeni şifreniz...">
          </div>
        </div>
        <button class="btn-minimal btn-secondary" id="btn-change-password" style="width:100%; margin-top:16px;">
          Şifreyi Güncelle
        </button>
      </div>

      <!-- Account Info Card -->
      <div class="dash-panel-card col-span-4">
        <div>
          <h3 style="font-family: var(--font-display); font-size: 20px; font-weight: 800; margin-bottom: 16px;">HESAP DETAYLARI</h3>
          <div style="margin-bottom: 12px;">
            <label style="font-size: 11px; color: var(--text-muted); font-weight: 700; text-transform: uppercase;">Kullanıcı ID</label>
            <div id="dash-uid" style="font-family: var(--font-code); font-size: 11px; color: var(--emerald); word-break: break-all; margin-top: 4px;">—</div>
          </div>
          <div>
            <label style="font-size: 11px; color: var(--text-muted); font-weight: 700; text-transform: uppercase;">Kayıt Tarihi</label>
            <div id="dash-created" style="font-size: 13px; color: var(--text-white); margin-top: 4px;">—</div>
          </div>
        </div>
        <button class="btn-minimal btn-secondary" id="btn-logout-bottom" style="width:100%; margin-top:16px; border-color: rgba(255, 77, 77, 0.4); color: #ff4d4d;">
          Hesaptan Çıkış Yap
        </button>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <p>© 2026 Bekofy. Tüm hakları saklıdır.</p>
  </footer>

  <script src="js/dashboard.js"></script>
</body>

</html>
