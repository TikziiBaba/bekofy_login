<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bekofy - Giriş Yap</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="stylesheet" href="../css/mobile.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.7/dist/umd/supabase.js" integrity="sha256-Jpf1G7PvpfELWwvKKjmzdysbj4EOaIXju41pwyQtXgc=" crossorigin="anonymous"></script>
</head>
<body>
  <!-- Custom Titlebar -->
  <div class="titlebar" id="titlebar">
    <div class="titlebar-drag">
      <span class="titlebar-title">Bekofy</span>
    </div>
    <div class="titlebar-controls">
      <button class="titlebar-btn" id="btn-minimize" title="Küçült">
        <svg width="12" height="12" viewBox="0 0 12 12"><rect y="5" width="12" height="2" fill="currentColor"/></svg>
      </button>
      <button class="titlebar-btn" id="btn-maximize" title="Büyüt">
        <svg width="12" height="12" viewBox="0 0 12 12"><rect x="1" y="1" width="10" height="10" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
      </button>
      <button class="titlebar-btn titlebar-btn-close" id="btn-close" title="Kapat">
        <svg width="12" height="12" viewBox="0 0 12 12"><path d="M1 1L11 11M11 1L1 11" stroke="currentColor" stroke-width="1.5"/></svg>
      </button>
    </div>
  </div>

  <!-- Auth Container -->
  <div class="auth-container">
    <!-- Left Side - Branding -->
    <div class="auth-branding">
      <div class="branding-content">
        <div class="logo-wrapper">
          <div class="logo-glow"></div>
          <div class="logo-icon">
            <svg viewBox="0 0 48 48" fill="none">
              <circle cx="24" cy="24" r="22" fill="url(#logoGrad)" />
              <path d="M16 14C16 14 32 18 32 24C32 30 16 34 16 34" stroke="white" stroke-width="3" stroke-linecap="round" fill="none"/>
              <path d="M16 20C16 20 28 22 28 24C28 26 16 28 16 28" stroke="white" stroke-width="3" stroke-linecap="round" fill="none"/>
              <path d="M16 25C16 25 22 23.5 22 24C22 24.5 16 25 16 25" stroke="white" stroke-width="3" stroke-linecap="round" fill="none"/>
              <defs>
                <linearGradient id="logoGrad" x1="0" y1="0" x2="48" y2="48">
                  <stop offset="0%" stop-color="#7C9A72"/>
                  <stop offset="100%" stop-color="#9AB88F"/>
                </linearGradient>
              </defs>
            </svg>
          </div>
        </div>
        <h1 class="brand-name">Bekofy</h1>
        <p class="brand-tagline">Müziğin yeni adresi. Keşfet, dinle, paylaş.</p>
        <div class="floating-notes">
          <span class="note">♫</span>
          <span class="note">♪</span>
          <span class="note">♬</span>
          <span class="note">♩</span>
          <span class="note">♫</span>
        </div>
      </div>
    </div>

    <!-- Right Side - Auth Form -->
    <div class="auth-form-wrapper">
      <div class="auth-form-container">
        <!-- Login Form -->
        <form action="" class="form" id="login-form">
            <p>
                Hoşgeldin,<span>devam etmek için giriş yap</span>
            </p>
            <button type="button" class="oauthButton" id="btn-google-login">
                <svg class="icon" viewBox="0 0 24 24">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
                    <path d="M1 1h22v22H1z" fill="none"></path>
                </svg>
                Google ile devam et
            </button>
            <div class="separator">
                <div></div>
                <span>VEYA</span>
                <div></div>
            </div>
            <input type="email" placeholder="E-posta" name="email" id="login-email">
            <input type="password" placeholder="Şifre" name="password" id="login-password">
            <button type="button" class="oauthButton" id="btn-login" style="background: var(--green-primary); color: #000; border-color: var(--green-primary);">
                <span>Giriş Yap</span>
                <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 17 5-5-5-5"></path><path d="m13 17 5-5-5-5"></path></svg>
            </button>
            <p class="auth-switch" style="font-size: 14px; color: var(--font-color-sub); margin-top: 10px;">Hesabın yok mu? <a href="#" id="show-register" style="color: var(--green-primary); text-decoration: none; font-weight: 600;">Kayıt Ol</a></p>
        </form>

        <!-- Register Form -->
        <form action="" class="form hidden" id="register-form">
            <p>
                Kayıt Ol,<span>müziği keşfetmeye başla</span>
            </p>
            <button type="button" class="oauthButton" id="btn-google-register">
                <svg class="icon" viewBox="0 0 24 24">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
                    <path d="M1 1h22v22H1z" fill="none"></path>
                </svg>
                Google ile Kayıt Ol
            </button>
            <div class="separator">
                <div></div>
                <span>VEYA</span>
                <div></div>
            </div>
            <input type="text" placeholder="Kullanıcı Adı" name="username" id="register-username">
            <input type="email" placeholder="E-posta" name="email" id="register-email">
            <input type="password" placeholder="Şifre" name="password" id="register-password">
            <button type="button" class="oauthButton" id="btn-register" style="background: var(--green-primary); color: #000; border-color: var(--green-primary);">
                <span>Kayıt Ol</span>
                <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 17 5-5-5-5"></path><path d="m13 17 5-5-5-5"></path></svg>
            </button>
            <p class="auth-switch" style="font-size: 14px; color: var(--font-color-sub); margin-top: 10px;">Zaten hesabın var mı? <a href="#" id="show-login" style="color: var(--green-primary); text-decoration: none; font-weight: 600;">Giriş Yap</a></p>
        </form>

        <!-- Error/Success Messages -->
        <div class="toast-container" id="toast-container"></div>
      </div>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/supabase.js"></script>
  <script>
    // Android/Capacitor: masaüstü titlebar'ı gizle
    if (window.Capacitor || document.URL.startsWith('https://localhost') || document.URL.indexOf('capacitor') !== -1) {
      var tb = document.getElementById('titlebar');
      if (tb) tb.style.display = 'none';
      var ac = document.querySelector('.auth-container');
      if (ac) ac.style.paddingTop = '0';
    }
  </script>
  <script src="../js/auth.js"></script>
</body>
</html>
